<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Three.js XR Model Viewer</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        overflow: hidden;
      }
      #info {
        position: absolute;
        top: 10px;
        width: 100%;
        text-align: center;
        z-index: 100;
        display: block;
      }
      a {
        color: #4080ff;
      }
    </style>
  </head>
  <body>
    <div id="info">
      <a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> -
      simple model viewer with XR
      <div id="xr-support"></div>
    </div>

    <script type="module">
      import * as THREE from "https://threejs.org/build/three.module.js";
      import { OrbitControls } from "https://threejs.org/examples/jsm/controls/OrbitControls.js";
      import { GLTFLoader } from "https://threejs.org/examples/jsm/loaders/GLTFLoader.js";
      import { VRButton } from "https://threejs.org/examples/jsm/webxr/VRButton.js";

      let camera, scene, renderer;
      let model;
      let xrButton;

      init();
      animate();

      async function init() {
        // Scene and Camera
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        camera = new THREE.PerspectiveCamera(
          75,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );
        camera.position.set(2, 2, 2);

        // Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
        scene.add(directionalLight);

        // Model Loading
        const loader = new GLTFLoader();
        try {
          const gltf = await loader.loadAsync("mario_cube_animation.glb"); // Replace with your model path
          model = gltf.scene;
          scene.add(model);
          // Center the model if necessary
          const box = new THREE.Box3().setFromObject(model);
          const center = box.getCenter(new THREE.Vector3());
          model.position.sub(center);
        } catch (error) {
          console.error("Error loading model:", error);
          document.getElementById(
            "info"
          ).innerHTML = `<a href="https://threejs.org" target="_blank" rel="noopener">three.js</a> - Error loading model. Check console for details.`;
        }

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.target.set(0, 0, 0);
        controls.update();

        // XR Button
        xrButton = VRButton.createButton(renderer);
        document.getElementById("xr-support").appendChild(xrButton);

        // Check XR support
        checkXRSupport().then((supported) => {
          if (!supported) {
            document.getElementById(
              "xr-support"
            ).innerHTML = `WebXR not supported on this browser/device.`;
          }
        });

        window.addEventListener("resize", onWindowResize);
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }

      function animate() {
        renderer.setAnimationLoop(render);
      }

      function render() {
        renderer.render(scene, camera);
      }

      async function checkXRSupport() {
        if (navigator.xr) {
          try {
            const supported = await navigator.xr.isSessionSupported("immersive-vr");
            return supported;
          } catch (err) {
            console.warn("WebXR not supported", err);
            return false;
          }
        } else {
          return false;
        }
      }
    </script>
  </body>
</html>
